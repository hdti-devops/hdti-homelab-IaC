name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PRE_COMMIT_VERSION: "4.7.0"
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the release checksums file.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  repository-checks:
    name: 🔎 Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - name: 🧪 Test the command guard hook
        run: python -m unittest discover -s .claude/hooks -v

      - name: 📦 Install pre-commit
        run: python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: 🧹 Run pre-commit on all files
        env:
          # The gitleaks hook scans staged changes only, so it finds nothing here; the next steps scan the full history.
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: 🔐 Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: 🕵️ Scan full git history for secrets
        run: gitleaks git --redact --verbose .
