# Gitleaks configuration: default rules plus homelab-specific secrets.
# Picked up automatically from the repository root by the pre-commit hook and the CI scan.

[extend]
useDefault = true

[[rules]]
id = "proxmox-api-token"
description = "Proxmox VE API token (user@realm!tokenid=uuid), with or without the PVEAPIToken= prefix"
regex = '''[\w.-]+@(?:pve|pam|pbs)![\w.-]+[=:][0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
keywords = ["@pve!", "@pam!", "@pbs!"]
